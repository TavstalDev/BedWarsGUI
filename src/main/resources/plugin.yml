main: io.github.tavstaldev.bedWarsGUI.BedWarsGUI
version: 1.0.5

name: BedWarsGUI
api-version: '1.21'
prefix: BedWarsGUI
authors: [ Tavstal ]
description: A simple but useful GUI for BedWars arena selection.
website: https://tavstaldev.github.io/
softdepend: [BedWars, ScreamingBedWars]
commands:
  bedwarsgui:
    description: Opens the BedWars arena selection GUI.
    usage: /bedwarsgui
    permission: bedwarsgui.commands.gui
    aliases: [ "bwgui", "bedgui", "bwarenas" ]
    subcommands:
      help:
        description: "Show help for the bedwarsgui command"
        usage: "/bedwarsgui help"
        permission: bedwarsgui.commands.help
      version:
        description: "Show the version of the plugin"
        usage: "/bedwarsgui version"
        permission: bedwarsgui.commands.version
      reload:
        description: "Reload the plugin"
        usage: "/bedwarsgui reload"
        permission: bedwarsgui.commands.reload
      open:
        description: "Open the BedWars arena selection GUI"
        usage: "/bedwarsgui open"
        permission: bedwarsgui.commands.gui
permissions:
  bedwarsgui.commands.reload:
    default: op
  bedwarsgui.commands.version:
    default: op
  bedwarsgui.commands.help:
      default: true
  bedwarsgui.commands.gui:
    description: Allows the player to use the /bedwarsgui command.
    default: true
  bedwarsgui.player:
    description: Collection of player permissions
    default: true
    children:
      bedwarsgui.commands.gui: true
      bedwarsgui.commands.help: true
  bedwarsgui.admin:
    description: Collection of admin permissions
    default: op
    children:
      bedwarsgui.commands.reload: true
      bedwarsgui.commands.version: true
  bedwarsgui.*:
    description: Gives all permissions related to the bedwarsgui plugin.
    default: op
    children:
      bedwarsgui.player: true
      bedwarsgui.admin: true
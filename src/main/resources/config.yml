# Supported locales: eng, hun
locale: eng
# If true, the plugin will try to use the player's locale
usePlayerLocale: true
# Prefix for all messages
prefix: "&cBed&fWarsGUI &8»"
# Shows debug messages
debug: false

# Command to join an arena
# %s will be replaced with the arena name
arenaJoinCommand: "bw join %s"
arenaAutoJoinCommand: "bw autojoin"

# Arena mode settings
# You can add/remove modes, but make sure to also update the lang file accordingly
# The maxPlayers is used for checking if an arena is suitable for the mode
# The item is used as the icon in the GUI
modes:
  - name: "Modes.Solo.Name"
    description: "Modes.Solo.Description"
    item: WOODEN_SWORD
    maxPlayers: 4 # This is for calculating if the arena is fit in this mode
    slot: 11
  - name: "Modes.Duo.Name"
    description: "Modes.Duo.Description"
    item: STONE_SWORD
    maxPlayers: 8 # This is for calculating if the arena is fit in this mode
    slot: 13
  - name: "Modes.Trio.Name"
    description: "Modes.Trio.Description"
    item: IRON_SWORD
    maxPlayers: 12 # This is for calculating if the arena is fit in this mode
    slot: 15
  - name: "Modes.Squads.Name"
    description: "Modes.Squads.Description"
    item: DIAMOND_SWORD
    maxPlayers: 16 # This is for calculating if the arena is fit in this mode
    slot: 22

# GUI settings
gui:
  placeholderItem: BLACK_STAINED_GLASS_PANE
  noPreviousPageItem: BLACK_STAINED_GLASS_PANE
  previousPageItem: ARROW
  currentPageItem: PAPER
  noNextPageItem: BLACK_STAINED_GLASS_PANE
  nextPageItem: ARROW
  closeItem: BARRIER
  backItem: SPRUCE_DOOR
  autoJoinItem: ENDER_EYE

# For setting arena item icons in the GUI
# The arena names here must match with the arena names in ScreamingBedWars.
# If an arena is not listed here, the defaultArenaItem will be used
arenas:
  defaultArenaItem: RED_STAINED_GLASS_PANE
  ArenaOne: GRASS_BLOCK
  ArenaTwo: SAND
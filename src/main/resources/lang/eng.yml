  Duo:
    Name: "Duo"
    Description:
    - "2v2 BedWars arenas."
  Trio:
    Name: "Trio"
    Description:
    - "3v3 BedWars arenas."
  Squads:
    Name: "Squads"
    Description:
      - "4v4 BedWars arenas."

Status:
  WAITING: "&eWaiting"
  RUNNING: "&aRunning"
  GAME_END_CELEBRATING: "&6Celebrating"
  REBUILDING: "&bRebuilding"
  DISABLED: "&cDisabled"

ArenaDescriptions:

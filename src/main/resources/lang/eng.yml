General:
  NoPermission: "%prefix% &cYou have no permission to do that."

Commands:
  ConsoleCaller: "%prefix% &cYou must be a player to use this command."
  UnknownError: "%prefix% &cUnknown error happened. Please report it."
  InGame: "%prefix% &cYou cannot use this command while in a game."
  Common:
    InvalidPage: "%prefix% &cInvalid page number."
  Help:
    Desc: "Shows information about the commands."
    Title: "&8&m        &r &bBedWars&3GUI &7Help &8&m    &r &7Page &3%current_page%&7/&3%max_page% &8&m        &r"
    Info: |-
      &r
      &r  &c&l[]&r &8- &7Required,   &e&l<>&r &8- &7Optional
      &r
    Line: "&r  &b/%command% %subcommand%&3%syntax% &8- &7%description%"
    Bottom: |-
      &r
      &8&m                       &r %previous_btn%&3%current_page%&7/&3%max_page%%next_btn% &8&m                       &r
    PrevBtn: "&b<< "
    NextBtn: " &b>>"
  Version:
    Desc: "Shows the plugin version."
    Current: "%prefix% &aYou are using the '&3%version%&a' version of BedWarsGUI."
    UpToDate: "%prefix% &aBedWarsGUI is up to date."
    Outdated: "%prefix% &cBedWarsGUI is outdated. You can download it here: &e%link%"
  Reload:
    Desc: "Reloads the plugin config and its messages."
    Done: "%prefix% &aThe plugin has been reloaded."
  Gui:
    Desc: "Opens the GUI."

GUI:
  Cancel: "&cCancel"
  Confirm: "&aConfirm"
  Close: "&cClose"
  Back: "&cBack"
  PreviousPage: "&7Previous Page"
  NextPage: "&7Next Page"
  Page: "&7Page: &f%page%"
  AutoJoin: "&aAuto Join"
  Main:
    Title: "&4> &cBedWars Arenas"
    Name: "&b%mode%"
    Lore:
      - "%description%"
      - "&7Click to view %mode% arenas."
  Arena:
    Title: "&4> &c%mode% Arenas"
    Name: "&b%arena%"
    Lore:
      - "%status%"
      - "&7Players: &a%players%&7/&a%max_players%"
      - "&8&m----------------"
      - "%description%"
      - "&8&m----------------"

